# HTTP — use this until Let's Encrypt certs exist.
# After certbot, point compose at nginx.docker.ssl.conf instead.

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

upstream invictus_frontend {
    server frontend:3000;
}

upstream invictus_backend {
    server backend:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name invictuspharma.net www.invictuspharma.net;

    client_max_body_size 25m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /django-admin {
        return 301 /django-admin/;
    }

    location /media/ {
        alias /var/www/invictus-media/;
        access_log off;
        expires 7d;
    }

    location /static/ {
        alias /var/www/invictus-static/;
        access_log off;
        expires 7d;
    }

    location /django-admin/ {
        proxy_pass http://invictus_backend/django-admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://invictus_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
