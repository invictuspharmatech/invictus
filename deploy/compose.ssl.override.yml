# Server-only HTTPS overlay. Copy once on the live box:
#   cp deploy/compose.ssl.override.yml docker-compose.override.yml
# docker-compose.override.yml is gitignored so git pull stays clean.
#
# Requires certs:
#   /etc/letsencrypt/live/invictuspharma.net/fullchain.pem

services:
  nginx:
    volumes:
      - ./deploy/nginx.docker.ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/media:/var/www/invictus-media:ro
      - ./data/static:/var/www/invictus-static:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
