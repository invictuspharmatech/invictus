# HTTPS — after:
#   sudo certbot certonly --webroot -w /var/www/certbot \
#     -d invictuspharma.net -d www.invictuspharma.net
# then in docker-compose.yml nginx volumes, change:
#   ./deploy/nginx.docker.conf  →  ./deploy/nginx.docker.ssl.conf
# and: docker compose up -d nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

upstream invictus_frontend {
    server frontend:3000;
}

upstream invictus_backend {
    server backend:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name invictuspharma.net www.invictuspharma.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name invictuspharma.net www.invictuspharma.net;

    ssl_certificate /etc/letsencrypt/live/invictuspharma.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/invictuspharma.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;

    location = /django-admin {
        return 301 /django-admin/;
    }

    location /media/ {
        alias /var/www/invictus-media/;
        access_log off;
        expires 7d;
    }

    location /static/ {
        alias /var/www/invictus-static/;
        access_log off;
        expires 7d;
    }

    location /django-admin/ {
        proxy_pass http://invictus_backend/django-admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://invictus_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
