# Invictus Pharma — production stack (same layout as ELP).
#
# MySQL/MariaDB runs on the HOST (systemd), never in Docker.
# That keeps dumps, binlogs, and master→slave replication on real disk.
# The backend reaches it through the host Unix socket (see volumes).
#
# First boot uses HTTP (deploy/nginx.docker.conf) so nginx starts without certs.
# After certbot, switch the nginx volume to deploy/nginx.docker.ssl.conf
# TLS:
#   sudo certbot certonly --webroot -w /var/www/certbot \
#     -d invictuspharma.net -d www.invictuspharma.net
#
# Persist uploads and Django static on the host:
#   ./data/media/   → /media/
#   ./data/static/  → /static/

services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_ADMIN_PATH: django-admin
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?set PUBLIC_SITE_URL in .env}
      MEDIA_ROOT: /app/media
      STATIC_ROOT: /app/staticfiles
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/media:/app/media
      - ./data/static:/app/staticfiles
      # Host mysqld socket — app talks to the machine MySQL, not a container DB.
      # Ubuntu/Debian: /var/run/mysqld/mysqld.sock
      - /var/run/mysqld/mysqld.sock:/run/mysqld/mysqld.sock
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5)",
        ]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 90s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DJANGO_API_URL: http://backend:8000
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?set PUBLIC_SITE_URL in .env}
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-Invictus Pharma}
        IMAGE_ORIGIN: ${IMAGE_ORIGIN:-https://greatlifepharma.com}
        AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_API_URL: http://backend:8000
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      NEXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?set PUBLIC_SITE_URL in .env}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?set PUBLIC_SITE_URL in .env}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 40s

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx.Dockerfile
    image: invictus-nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/media:/var/www/invictus-media:ro
      - ./data/static:/var/www/invictus-static:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
